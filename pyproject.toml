[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-earth"
version = "0.1.0"
description = "Reproducible elevation-band connectivity experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
test = ["pytest>=7"]

[project.scripts]
layered-earth = "layered_earth:main"

[tool.setuptools]
py-modules = ["layered_earth"]
